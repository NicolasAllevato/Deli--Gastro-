name = "fudo-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]
account_id = "53d56863addd21be708a642b540e5990"
workers_dev = true

# Pasarela Deli-Gastro <-> Fudo (Integrations API v1). Ver docs/FUDO_INTEGRACION.md.
#   POST /sync      la app pide mandar un pedido a Fudo (firma x-gateway-signature)
#   POST /webhook   webhooks de Fudo (firma fudo-signature) -> la app aplica el estado
#   GET  /products  catálogo de Fudo para la pantalla de mapeo (firma del path)
#   cron            reintenta pedidos pending/failed

# Token de Fudo (dura 24 h) cacheado entre isolates.
# Crear con:  npx wrangler kv namespace create FUDO_KV   y pegar el id acá.
[[kv_namespaces]]
binding = "FUDO_KV"
id = "edecc57f9a2b46c88f09c2254d8ab4cb"

[triggers]
crons = ["*/5 * * * *"]

[vars]
FUDO_API_URL = "https://integrations.fu.do/fudo"
# API pública de Fudo (catálogo y ventas): token en FUDO_AUTH_URL, datos en FUDO_PUBLIC_API_URL.
FUDO_AUTH_URL = "https://auth.fu.do/api"
FUDO_PUBLIC_API_URL = "https://api.fu.do/v1alpha1"
APP_URL = "https://dely.opsyn.app"
# Sync automático del catálogo cada 15 min: "0" apagado, "1" prendido. Antes de prender en otro entorno, revisar un simulacro con POST /catalog-sync?dry=1.
CATALOG_CRON = "1"
# Ventas de delivery y take away (cada 5 min) y clientes (cada hora): prendidos el 2026-11-04 tras revisar el simulacro.
SALES_CRON = "1"
CUSTOMERS_CRON = "1"
# DEBUG_WEBHOOK_BODY = "1"  # temporal: loguea el webhook completo (datos del cliente) hasta conocer el formato

# Secrets (npx wrangler secret put <NOMBRE>, nunca en el repo):
#   FUDO_API_KEY, FUDO_API_SECRET        credenciales de la API pública (usuario crm-dely@lagambeta): catálogo y ventas
#   FUDO_CLIENT_ID, FUDO_CLIENT_SECRET   credenciales de la API de integraciones (pedidos); llegan con el integrator token
#   FUDO_INTEGRATOR_TOKEN                lo asigna Fudo al aprobar la integración
#   FUDO_GATEWAY_SECRET                  compartido con la app (misma variable en Vercel)
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

[observability]
enabled = true
