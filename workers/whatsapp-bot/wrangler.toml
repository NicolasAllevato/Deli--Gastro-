name = "whatsapp-bot"
main = "src/index.ts"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]
account_id = "e7351dd776e005da826ba6f2a5aae4c1"

# bot-dely.opsyn.app/webhook llega acá por el Worker dely-proxy (cuenta Opsyn wallet), no por una ruta de este Worker.
workers_dev = true
routes = [{ pattern = "bot.la-gambeta.com", custom_domain = true }]

# Corre cerca de Supabase (la base) en vez de cerca de Meta: menos latencia por consulta.
[placement]
mode = "smart"

# Postgres de Supabase por Hyperdrive con el rol `deli_bot` (migración 015).
# Crear con:  npx wrangler hyperdrive create deli-gastro-db --connection-string="postgres://deli_bot.<ref>:<clave>@<pooler>:6543/postgres"
# y pegar acá el id que devuelve (el id no es secreto; la cadena de conexión queda solo en Cloudflare).
[[hyperdrive]]
binding = "DB"
id = "1a9f0b99798d4bf4ac2fb0b0fa0aa857"

# Workers AI: clasificador, respondedor y transcripción de audios (sin OpenAI).
[ai]
binding = "AI"

# Apilador: un Durable Object por teléfono junta la ráfaga (hasta 5 mensajes, 4 s de silencio, 12 s máximo)
# y encola UN turno en wa-inbound. Ver src/batching.ts.
[[durable_objects.bindings]]
name = "BUFFER"
class_name = "ConversationBuffer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationBuffer"]

[[queues.producers]]
binding = "INBOUND"
queue = "wa-inbound"

# Fase 4: el consumidor (clasificador + respondedor) lee los turnos ya agrupados.
[[queues.consumers]]
queue = "wa-inbound"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "wa-inbound-dlq"

# Turnos agotados: aviso único al cliente + takeover (src/turn-ledger.ts).
[[queues.consumers]]
queue = "wa-inbound-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# Secrets (no van en este archivo; se cargan con `npx wrangler secret put <NOMBRE>`):
#   BOT_INTERNAL_SECRET  Fase 5. Firma las llamadas a /api/internal/bot/*. Idéntico al de Vercel (Production y Preview),
#                        >= 32 caracteres, sin BOM ni espacios. Sin él, el bot deriva los pedidos a la web.
#   OPENAI_API_KEY       Aprendizaje nocturno (cron). Sin él el cron no analiza nada.
# Migración a D1 (docs/migracion-supabase-d1.md): base deli-gastro. Solo se usa si DATA_BACKEND es "dual" o "d1".
[[d1_databases]]
binding = "D1"
database_name = "deli-gastro"
database_id = "8e293f66-d614-4519-8514-be4dd6a3ac44"

[vars]
# "supabase" (default): no copia nada a D1. Cambiar a "dual" solo con OK del usuario.
# "d1" (corte): el bot usa solo D1 y lee los secretos de Meta de Worker secrets:
#   WHATSAPP_APP_SECRET, WHATSAPP_VERIFY_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_ACCESS_TOKEN
DATA_BACKEND = "d1"
APP_URL = "https://opsyndely.la-gambeta.com"

# Etapa 3: aprendizaje nocturno desde conversaciones reales, 06:00 UTC (03:00 AR). Necesita el secret OPENAI_API_KEY
# (sin él no hace nada) y la migración d1/migrations/0013 aplicada.
[triggers]
crons = ["0 6 * * *"]

[observability]
enabled = true
