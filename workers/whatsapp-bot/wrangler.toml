name = "whatsapp-bot"
main = "src/index.ts"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]
account_id = "e7351dd776e005da826ba6f2a5aae4c1"

# Webhook de Meta: https://bot-dely.opsyn.app/webhook. El dominio ya está comprado y responde (verificado el 2026-11-03);
# está enlazado desde el dashboard de Cloudflare. Si se quiere versionar acá:
# routes = [{ pattern = "bot-dely.opsyn.app", custom_domain = true }]
workers_dev = true
routes = [{ pattern = "bot.la-gambeta.com", custom_domain = true }]

# Corre cerca de Supabase (la base) en vez de cerca de Meta: menos latencia por consulta.
[placement]
mode = "smart"

# Postgres de Supabase por Hyperdrive con el rol `deli_bot` (migración 015).
# Crear con:  npx wrangler hyperdrive create deli-gastro-db --connection-string="postgres://deli_bot.<ref>:<clave>@<pooler>:6543/postgres"
# y pegar acá el id que devuelve (el id no es secreto; la cadena de conexión queda solo en Cloudflare).
[[hyperdrive]]
binding = "DB"
id = "1a9f0b99798d4bf4ac2fb0b0fa0aa857"

# Workers AI: clasificador, respondedor y transcripción de audios (sin OpenAI).
[ai]
binding = "AI"

# Apilador: un Durable Object por teléfono junta la ráfaga (hasta 5 mensajes, 4 s de silencio, 12 s máximo)
# y encola UN turno en wa-inbound. Ver src/batching.ts.
[[durable_objects.bindings]]
name = "BUFFER"
class_name = "ConversationBuffer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationBuffer"]

[[queues.producers]]
binding = "INBOUND"
queue = "wa-inbound"

# Fase 4: el consumidor (clasificador + respondedor) lee los turnos ya agrupados.
[[queues.consumers]]
queue = "wa-inbound"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "wa-inbound-dlq"

# Secrets (no van en este archivo; se cargan con `npx wrangler secret put <NOMBRE>`):
#   BOT_INTERNAL_SECRET  Fase 5. Firma las llamadas a /api/internal/bot/*. Idéntico al de Vercel (Production y Preview),
#                        >= 32 caracteres, sin BOM ni espacios. Sin él, el bot deriva los pedidos a la web.
[vars]
APP_URL = "https://dely.opsyn.app"

[observability]
enabled = true
