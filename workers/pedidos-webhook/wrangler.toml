name = "pedidos-webhook"
account_id = "e7351dd776e005da826ba6f2a5aae4c1"
main = "src/index.ts"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]

# Secrets requeridos (NO van acá, se setean con `npx wrangler secret put <NOMBRE>`
# desde este directorio, una vez que el proyecto Supabase real esté conectado):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   WEBHOOK_SECRET       (compartido con el llamador; firma HMAC-SHA256 del
#                         body en el header `x-webhook-signature`, hex)

# Migración a D1 (docs/migracion-supabase-d1.md): base deli-gastro. Con DATA_BACKEND = "d1" el Worker
# usa solo este binding (sin SUPABASE_*). El cambio de valor se hace en el corte (docs/runbook-corte-d1.md).
[[d1_databases]]
binding = "DB"
database_name = "deli-gastro"
database_id = "8e293f66-d614-4519-8514-be4dd6a3ac44"

[vars]
DATA_BACKEND = "supabase"
